services:
  supabase-kong:
    image: 'public.ecr.aws/supabase/kong:2.8.1@sha256:1b53405d8680a09d6f44494b7990bf7da2ea43f84a258c59717d4539abf09f6d'
    entrypoint: 'bash -c ''eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'''
    depends_on:
      supabase-analytics:
        condition: service_healthy
    environment:
      - 'JWT_SECRET=${SERVICE_PASSWORD_JWT}'
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/home/kong/kong.yml
      - 'KONG_DNS_ORDER=LAST,A,CNAME'
      - KONG_NGINX_PROXY_PROXY_BUFFER_SIZE=160k
      - 'KONG_NGINX_PROXY_PROXY_BUFFERS=64 160k'
      - KONG_NGINX_PROXY_CLIENT_MAX_BODY_SIZE=0
      - KONG_PLUGINS=bundled
      - 'KONG_PORT_MAPS=443:8000'
      - SERVICE_URL_SUPABASEKONG_8000
      - 'SUPABASE_ANON_KEY=${SERVICE_SUPABASEANON_KEY}'
      - 'SUPABASE_SERVICE_KEY=${SERVICE_SUPABASESERVICE_KEY}'
      - 'DASHBOARD_USERNAME=${SERVICE_USER_ADMIN}'
      - 'DASHBOARD_PASSWORD=${SERVICE_PASSWORD_ADMIN}'
    volumes:
      - type: bind
        source: ./volumes/api/kong.yml
        target: /home/kong/temp.yml
        content: "_format_version: '2.1'\n_transform: true\n\nconsumers:\n  - username: DASHBOARD\n  - username: anon\n    keyauth_credentials:\n      - key: $SUPABASE_ANON_KEY\n  - username: service_role\n    keyauth_credentials:\n      - key: $SUPABASE_SERVICE_KEY\n\nacls:\n  - consumer: anon\n    group: anon\n  - consumer: service_role\n    group: admin\n\nbasicauth_credentials:\n  - consumer: DASHBOARD\n    username: '$DASHBOARD_USERNAME'\n    password: '$DASHBOARD_PASSWORD'\n\nservices:\n  # Open Auth routes\n  - name: auth-v1-open-verify\n    url: http://supabase-auth:9999/verify\n    routes:\n      - name: auth-v1-open-verify\n        strip_path: true\n        paths:\n          - /auth/v1/verify\n    plugins:\n      - name: cors\n\n  - name: auth-v1-open-callback\n    url: http://supabase-auth:9999/callback\n    routes:\n      - name: auth-v1-open-callback\n        strip_path: true\n        paths:\n          - /auth/v1/callback\n    plugins:\n      - name: cors\n\n  - name: auth-v1-open-authorize\n    url: http://supabase-auth:9999/authorize\n    routes:\n      - name: auth-v1-open-authorize\n        strip_path: true\n        paths:\n          - /auth/v1/authorize\n    plugins:\n      - name: cors\n\n  # -------------------------\n  # Open OAuth 2.1 Server routes (MUST be public: no apikey)\n  # -------------------------\n  - name: auth-v1-open-oauth-server\n    url: http://supabase-auth:9999/oauth\n    routes:\n      - name: auth-v1-open-oauth-server\n        strip_path: true\n        paths:\n          - /auth/v1/oauth\n    plugins:\n      - name: cors\n\n  - name: auth-v1-open-well-known\n    url: http://supabase-auth:9999/.well-known\n    routes:\n      - name: auth-v1-open-well-known\n        strip_path: true\n        paths:\n          - /auth/v1/.well-known\n    plugins:\n      - name: cors\n\n  # OAuth discovery (tolerate path-based probes by rewriting URI)\n  - name: auth-open-oauth-discovery-any\n    url: http://supabase-auth:9999\n    routes:\n      - name: auth-open-oauth-discovery-any\n        strip_path: false\n        paths:\n          - /.well-known/oauth-authorization-server\n    plugins:\n      - name: cors\n      - name: request-transformer\n        config:\n          replace:\n            uri: \"/.well-known/oauth-authorization-server\"\n\n  # OIDC discovery (tolerate path-based probes by rewriting URI)\n  - name: auth-open-oidc-discovery-any\n    url: http://supabase-auth:9999\n    routes:\n      - name: auth-open-oidc-discovery-any\n        strip_path: false\n        paths:\n          - /.well-known/openid-configuration\n    plugins:\n      - name: cors\n      - name: request-transformer\n        config:\n          replace:\n            uri: \"/.well-known/openid-configuration\"\n\n  # -------------------------\n  # Open SSO (SAML) routes\n  # -------------------------\n  - name: auth-v1-open-sso-start\n    url: http://supabase-auth:9999/sso/saml\n    routes:\n      - name: auth-v1-open-sso-start\n        strip_path: true\n        paths:\n          - /auth/v1/sso/saml\n          - /sso/saml\n        methods:\n          - GET\n          - HEAD\n          - OPTIONS\n    plugins:\n      - name: cors\n\n  - name: auth-v1-open-sso-metadata\n    url: http://supabase-auth:9999/sso/saml/metadata\n    routes:\n      - name: auth-v1-open-sso-metadata\n        strip_path: true\n        paths:\n          - /auth/v1/sso/saml/metadata\n          - /sso/saml/metadata\n        methods:\n          - GET\n          - HEAD\n          - OPTIONS\n    plugins:\n      - name: cors\n\n  - name: auth-v1-open-sso-acs\n    url: http://supabase-auth:9999/sso/saml/acs\n    routes:\n      - name: auth-v1-open-sso-acs\n        strip_path: true\n        paths:\n          - /auth/v1/sso/saml/acs\n          - /sso/saml/acs\n        methods:\n          - POST\n          - OPTIONS\n    plugins:\n      - name: cors\n\n  - name: auth-v1-open-sso-slo\n    url: http://supabase-auth:9999/sso/saml/slo\n    routes:\n      - name: auth-v1-open-sso-slo\n        strip_path: true\n        paths:\n          - /auth/v1/sso/saml/slo\n          - /sso/saml/slo\n        methods:\n          - POST\n          - OPTIONS\n    plugins:\n      - name: cors\n\n  - name: auth-v1-open-sso\n    url: http://supabase-auth:9999/sso\n    routes:\n      - name: auth-v1-open-sso\n        strip_path: true\n        paths:\n          - /auth/v1/sso\n          - /sso\n        methods:\n          - POST\n          - OPTIONS\n    plugins:\n      - name: cors\n\n  # Secure Auth routes\n  - name: auth-v1\n    url: http://supabase-auth:9999/\n    routes:\n      - name: auth-v1-all\n        strip_path: true\n        paths:\n          - /auth/v1/\n    plugins:\n      - name: cors\n      - name: key-auth\n        config:\n          hide_credentials: false\n      - name: acl\n        config:\n          hide_groups_header: true\n          allow:\n            - admin\n            - anon\n\n  # -------------------------\n  # Secure REST routes (/rest/v1/*)\n  # -------------------------\n  - name: rest-v1\n    url: http://supabase-rest:3000/\n    routes:\n      - name: rest-v1-all\n        strip_path: true\n        paths:\n          - /rest/v1/\n    plugins:\n      - name: cors\n      - name: key-auth\n        config:\n          hide_credentials: true\n      - name: acl\n        config:\n          hide_groups_header: true\n          allow:\n            - admin\n            - anon\n\n  # -------------------------\n  # Secure GraphQL routes (/graphql/v1)\n  # -------------------------\n  - name: graphql-v1\n    url: http://supabase-rest:3000/rpc/graphql\n    routes:\n      - name: graphql-v1-all\n        strip_path: true\n        paths:\n          - /graphql/v1\n    plugins:\n      - name: cors\n      - name: key-auth\n        config:\n          hide_credentials: true\n      - name: request-transformer\n        config:\n          add:\n            headers:\n              - \"Content-Profile:graphql_public\"\n      - name: acl\n        config:\n          hide_groups_header: true\n          allow:\n            - admin\n            - anon\n\n  # -------------------------\n  # Secure Realtime routes\n  # -------------------------\n  - name: realtime-v1-ws\n    url: http://realtime-dev:4000/socket\n    protocol: ws\n    routes:\n      - name: realtime-v1-ws\n        strip_path: true\n        paths:\n          - /realtime/v1/\n    plugins:\n      - name: cors\n      - name: key-auth\n        config:\n          hide_credentials: false\n      - name: acl\n        config:\n          hide_groups_header: true\n          allow:\n            - admin\n            - anon\n\n  - name: realtime-v1-rest\n    url: http://realtime-dev:4000/api\n    protocol: http\n    routes:\n      - name: realtime-v1-rest\n        strip_path: true\n        paths:\n          - /realtime/v1/api\n    plugins:\n      - name: cors\n      - name: key-auth\n        config:\n          hide_credentials: false\n      - name: acl\n        config:\n          hide_groups_header: true\n          allow:\n            - admin\n            - anon\n\n  # -------------------------\n  # Storage routes (storage handles its own auth)\n  # -------------------------\n  - name: storage-v1\n    url: http://supabase-storage:5000/\n    routes:\n      - name: storage-v1-all\n        strip_path: true\n        paths:\n          - /storage/v1/\n        request_buffering: false\n        response_buffering: false\n    plugins:\n      - name: cors\n\n  # -------------------------\n  # Edge Functions routes\n  # -------------------------\n  - name: functions-v1\n    url: http://supabase-edge-functions:9000/\n    read_timeout: 150000\n    routes:\n      - name: functions-v1-all\n        strip_path: true\n        paths:\n          - /functions/v1/\n    plugins:\n      - name: cors\n\n  ## Not used - Studio and Vector talk directly to analytics via Docker networking.\n  ## If external access is needed, add routes with key-auth matching Logflare's x-api-key auth.\n  # -------------------------\n  # Analytics routes\n  # -------------------------\n  # - name: analytics-v1\n  #   url: http://supabase-analytics:4000/\n  #   routes:\n  #     - name: analytics-v1-all\n  #       strip_path: true\n  #       paths:\n  #         - /analytics/v1/\n  #   plugins: []\n\n  # -------------------------\n  # Secure Database meta routes (/pg/*)\n  # -------------------------\n  - name: meta\n    url: http://supabase-meta:8080/\n    routes:\n      - name: meta-all\n        strip_path: true\n        paths:\n          - /pg/\n    plugins:\n      - name: key-auth\n        config:\n          hide_credentials: false\n      - name: acl\n        config:\n          hide_groups_header: true\n          allow:\n            - admin\n\n  # -------------------------\n  # Studio dashboard (basic auth via DASHBOARD consumer)\n  # -------------------------\n  - name: dashboard\n    url: http://supabase-studio:3000/\n    routes:\n      - name: dashboard-all\n        strip_path: true\n        paths:\n          - /\n    plugins:\n      - name: cors\n      - name: basic-auth\n        config:\n          hide_credentials: true\n"
  supabase-studio:
    image: 'supabase/studio:2026.08.31-sha-2c76bb3'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 20s
    depends_on:
      supabase-analytics:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: 'http://supabase-meta:8080'
      POSTGRES_PASSWORD: '${SERVICE_PASSWORD_POSTGRES}'
      POSTGRES_HOST: '${POSTGRES_HOSTNAME:-supabase-db}'
      POSTGRES_PORT: '${POSTGRES_PORT:-5432}'
      POSTGRES_DB: '${POSTGRES_DB:-postgres}'
      PG_META_CRYPTO_KEY: '${SERVICE_PASSWORD_PGMETACRYPTO}'
      DEFAULT_ORGANIZATION_NAME: '${STUDIO_DEFAULT_ORGANIZATION:-MovieTable}'
      DEFAULT_PROJECT_NAME: '${STUDIO_DEFAULT_PROJECT:-movietable}'
      SUPABASE_URL: 'http://supabase-kong:8000'
      SUPABASE_PUBLIC_URL: '${SERVICE_URL_SUPABASEKONG}'
      SUPABASE_ANON_KEY: '${SERVICE_SUPABASEANON_KEY}'
      SUPABASE_SERVICE_KEY: '${SERVICE_SUPABASESERVICE_KEY}'
      AUTH_JWT_SECRET: '${SERVICE_PASSWORD_JWT}'
      LOGFLARE_API_KEY: '${SERVICE_PASSWORD_LOGFLARE}'
      LOGFLARE_PUBLIC_ACCESS_TOKEN: '${SERVICE_PASSWORD_LOGFLARE}'
      LOGFLARE_PRIVATE_ACCESS_TOKEN: '${SERVICE_PASSWORD_LOGFLAREPRIVATE}'
      LOGFLARE_URL: 'http://supabase-analytics:4000'
      SUPABASE_PUBLIC_API: '${SERVICE_URL_SUPABASEKONG}'
      NEXT_PUBLIC_SUPABASE_URL: '${SERVICE_URL_SUPABASEKONG}'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: '${SERVICE_SUPABASEANON_KEY}'
      NEXT_PUBLIC_ENABLE_LOGS: 'true'
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
      OPENAI_API_KEY: '${OPENAI_API_KEY}'
      SNIPPETS_MANAGEMENT_FOLDER: /var/lib/supabase/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
      PGRST_DB_SCHEMAS: '${PGRST_DB_SCHEMAS:-public,storage,graphql_public}'
      PGRST_DB_MAX_ROWS: '${PGRST_DB_MAX_ROWS:-1000}'
      PGRST_DB_EXTRA_SEARCH_PATH: '${PGRST_DB_EXTRA_SEARCH_PATH:-public}'
    volumes:
      - 'supabase-snippets:/var/lib/supabase/snippets'
      - './volumes/functions:/app/edge-functions:z'
  supabase-db:
    image: 'supabase/postgres:17.6.1.159'
    healthcheck:
      test: 'pg_isready -U postgres -h 127.0.0.1'
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      supabase-vector:
        condition: service_healthy
    command:
      - postgres
      - '-c'
      - config_file=/etc/postgresql/postgresql.conf
      - '-c'
      - log_min_messages=log
    environment:
      - POSTGRES_HOST=/var/run/postgresql
      - 'PGPORT=${POSTGRES_PORT:-5432}'
      - 'POSTGRES_PORT=${POSTGRES_PORT:-5432}'
      - 'PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - 'PGDATABASE=${POSTGRES_DB:-postgres}'
      - 'POSTGRES_DB=${POSTGRES_DB:-postgres}'
      - 'JWT_SECRET=${SERVICE_PASSWORD_JWT}'
      - 'JWT_EXP=${JWT_EXPIRY:-3600}'
    volumes:
      - 'supabase-db-data:/var/lib/postgresql/data'
      - type: bind
        source: ./volumes/db/realtime.sql
        target: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
        content: |+
          \set pguser `echo "$POSTGRES_USER"`

          create schema if not exists _realtime;
          alter schema _realtime owner to :pguser;

      - type: bind
        source: ./volumes/db/_supabase.sql
        target: /docker-entrypoint-initdb.d/migrations/97-_supabase.sql
        content: |+
          \set pguser `echo "$POSTGRES_USER"`

          CREATE DATABASE _supabase WITH OWNER :pguser;

      - type: bind
        source: ./volumes/db/pooler.sql
        target: /docker-entrypoint-initdb.d/migrations/99-pooler.sql
        content: |+
          \set pguser `echo "$POSTGRES_USER"`
          \c _supabase
          create schema if not exists _supavisor;
          alter schema _supavisor owner to :pguser;
          \c postgres

      - type: bind
        source: ./volumes/db/webhooks.sql
        target: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
        content: |+
          BEGIN;
          -- Create pg_net extension
          CREATE EXTENSION IF NOT EXISTS pg_net SCHEMA extensions;
          -- Create supabase_functions schema
          CREATE SCHEMA supabase_functions AUTHORIZATION supabase_admin;
          GRANT USAGE ON SCHEMA supabase_functions TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;
          -- supabase_functions.migrations definition
          CREATE TABLE supabase_functions.migrations (
            version text PRIMARY KEY,
            inserted_at timestamptz NOT NULL DEFAULT NOW()
          );
          -- Initial supabase_functions migration
          INSERT INTO supabase_functions.migrations (version) VALUES ('initial');
          -- supabase_functions.hooks definition
          CREATE TABLE supabase_functions.hooks (
            id bigserial PRIMARY KEY,
            hook_table_id integer NOT NULL,
            hook_name text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT NOW(),
            request_id bigint
          );
          CREATE INDEX supabase_functions_hooks_request_id_idx ON supabase_functions.hooks USING btree (request_id);
          CREATE INDEX supabase_functions_hooks_h_table_id_h_name_idx ON supabase_functions.hooks USING btree (hook_table_id, hook_name);
          COMMENT ON TABLE supabase_functions.hooks IS 'Supabase Functions Hooks: Audit trail for triggered hooks.';
          CREATE FUNCTION supabase_functions.http_request()
            RETURNS trigger
            LANGUAGE plpgsql
            AS $function$
            DECLARE
              request_id bigint;
              payload jsonb;
              url text := TG_ARGV[0]::text;
              method text := TG_ARGV[1]::text;
              headers jsonb DEFAULT '{}'::jsonb;
              params jsonb DEFAULT '{}'::jsonb;
              timeout_ms integer DEFAULT 1000;
            BEGIN
              IF url IS NULL OR url = 'null' THEN
                RAISE EXCEPTION 'url argument is missing';
              END IF;

              IF method IS NULL OR method = 'null' THEN
                RAISE EXCEPTION 'method argument is missing';
              END IF;

              IF TG_ARGV[2] IS NULL OR TG_ARGV[2] = 'null' THEN
                headers = '{"Content-Type": "application/json"}'::jsonb;
              ELSE
                headers = TG_ARGV[2]::jsonb;
              END IF;

              IF TG_ARGV[3] IS NULL OR TG_ARGV[3] = 'null' THEN
                params = '{}'::jsonb;
              ELSE
                params = TG_ARGV[3]::jsonb;
              END IF;

              IF TG_ARGV[4] IS NULL OR TG_ARGV[4] = 'null' THEN
                timeout_ms = 1000;
              ELSE
                timeout_ms = TG_ARGV[4]::integer;
              END IF;

              CASE
                WHEN method = 'GET' THEN
                  SELECT http_get INTO request_id FROM net.http_get(
                    url,
                    params,
                    headers,
                    timeout_ms
                  );
                WHEN method = 'POST' THEN
                  payload = jsonb_build_object(
                    'old_record', OLD,
                    'record', NEW,
                    'type', TG_OP,
                    'table', TG_TABLE_NAME,
                    'schema', TG_TABLE_SCHEMA
                  );

                  SELECT http_post INTO request_id FROM net.http_post(
                    url,
                    payload,
                    params,
                    headers,
                    timeout_ms
                  );
                ELSE
                  RAISE EXCEPTION 'method argument % is invalid', method;
              END CASE;

              INSERT INTO supabase_functions.hooks
                (hook_table_id, hook_name, request_id)
              VALUES
                (TG_RELID, TG_NAME, request_id);

              RETURN NEW;
            END
          $function$;
          -- Supabase super admin
          DO
          $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM pg_roles
              WHERE rolname = 'supabase_functions_admin'
            )
            THEN
              CREATE USER supabase_functions_admin NOINHERIT CREATEROLE LOGIN NOREPLICATION;
            END IF;
          END
          $$;
          GRANT ALL PRIVILEGES ON SCHEMA supabase_functions TO supabase_functions_admin;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA supabase_functions TO supabase_functions_admin;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA supabase_functions TO supabase_functions_admin;
          ALTER USER supabase_functions_admin SET search_path = "supabase_functions";
          ALTER table "supabase_functions".migrations OWNER TO supabase_functions_admin;
          ALTER table "supabase_functions".hooks OWNER TO supabase_functions_admin;
          ALTER function "supabase_functions".http_request() OWNER TO supabase_functions_admin;
          GRANT supabase_functions_admin TO postgres;
          -- Remove unused supabase_pg_net_admin role
          DO
          $$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_roles
              WHERE rolname = 'supabase_pg_net_admin'
            )
            THEN
              REASSIGN OWNED BY supabase_pg_net_admin TO supabase_admin;
              DROP OWNED BY supabase_pg_net_admin;
              DROP ROLE supabase_pg_net_admin;
            END IF;
          END
          $$;
          -- pg_net grants when extension is already enabled
          DO
          $$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_extension
              WHERE extname = 'pg_net'
            )
            THEN
              GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            END IF;
          END
          $$;
          -- Event trigger for pg_net
          CREATE OR REPLACE FUNCTION extensions.grant_pg_net_access()
          RETURNS event_trigger
          LANGUAGE plpgsql
          AS $$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_event_trigger_ddl_commands() AS ev
              JOIN pg_extension AS ext
              ON ev.objid = ext.oid
              WHERE ext.extname = 'pg_net'
            )
            THEN
              GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            END IF;
          END;
          $$;
          COMMENT ON FUNCTION extensions.grant_pg_net_access IS 'Grants access to pg_net';
          DO
          $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM pg_event_trigger
              WHERE evtname = 'issue_pg_net_access'
            ) THEN
              CREATE EVENT TRIGGER issue_pg_net_access ON ddl_command_end WHEN TAG IN ('CREATE EXTENSION')
              EXECUTE PROCEDURE extensions.grant_pg_net_access();
            END IF;
          END
          $$;
          INSERT INTO supabase_functions.migrations (version) VALUES ('20210809183423_update_grants');
          ALTER function supabase_functions.http_request() SECURITY DEFINER;
          ALTER function supabase_functions.http_request() SET search_path = supabase_functions;
          REVOKE ALL ON FUNCTION supabase_functions.http_request() FROM PUBLIC;
          GRANT EXECUTE ON FUNCTION supabase_functions.http_request() TO postgres, anon, authenticated, service_role;
          COMMIT;

      - type: bind
        source: ./volumes/db/roles.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
        content: |+
          -- NOTE: change to your own passwords for production environments
           \set pgpass `echo "$POSTGRES_PASSWORD"`

           ALTER USER authenticator WITH PASSWORD :'pgpass';
           ALTER USER pgbouncer WITH PASSWORD :'pgpass';
           ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';
           ALTER USER supabase_functions_admin WITH PASSWORD :'pgpass';
           ALTER USER supabase_storage_admin WITH PASSWORD :'pgpass';

      - type: bind
        source: ./volumes/db/jwt.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
        content: |+
          \set jwt_secret `echo "$JWT_SECRET"`
          \set jwt_exp `echo "$JWT_EXP"`
          \set db_name `echo "${POSTGRES_DB:-postgres}"`

          ALTER DATABASE :db_name SET "app.settings.jwt_secret" TO :'jwt_secret';
          ALTER DATABASE :db_name SET "app.settings.jwt_exp" TO :'jwt_exp';

      - type: bind
        source: ./volumes/db/logs.sql
        target: /docker-entrypoint-initdb.d/migrations/99-logs.sql
        content: |+
          \set pguser `echo "$POSTGRES_USER"`
          \c _supabase
          create schema if not exists _analytics;
          alter schema _analytics owner to :pguser;
          \c postgres

      - 'supabase-db-config:/etc/postgresql-custom'
  supabase-analytics:
    image: 'supabase/logflare:1.43.1'
    healthcheck:
      test:
        - CMD
        - curl
        - 'http://127.0.0.1:4000/health'
      timeout: 5s
      interval: 5s
      retries: 10
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      - LOGFLARE_NODE_HOST=127.0.0.1
      - DB_USERNAME=supabase_admin
      - DB_DATABASE=_supabase
      - 'DB_HOSTNAME=${POSTGRES_HOSTNAME:-supabase-db}'
      - 'DB_PORT=${POSTGRES_PORT:-5432}'
      - 'DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - DB_SCHEMA=_analytics
      - 'LOGFLARE_API_KEY=${SERVICE_PASSWORD_LOGFLARE}'
      - 'LOGFLARE_PUBLIC_ACCESS_TOKEN=${SERVICE_PASSWORD_LOGFLARE}'
      - 'LOGFLARE_PRIVATE_ACCESS_TOKEN=${SERVICE_PASSWORD_LOGFLAREPRIVATE}'
      - LOGFLARE_SINGLE_TENANT=true
      - LOGFLARE_SINGLE_TENANT_MODE=true
      - LOGFLARE_SUPABASE_MODE=true
      - LOGFLARE_MIN_CLUSTER_SIZE=1
      - 'POSTGRES_BACKEND_URL=postgresql://supabase_admin:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/_supabase'
      - POSTGRES_BACKEND_SCHEMA=_analytics
      - LOGFLARE_FEATURE_FLAG_OVERRIDE=multibackend=true
  supabase-vector:
    image: 'timberio/vector:0.53.0-alpine'
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--tries=1'
        - '--spider'
        - 'http://supabase-vector:9001/health'
      timeout: 5s
      interval: 5s
      retries: 3
    volumes:
      - type: bind
        source: ./volumes/logs/vector.yml
        target: /etc/vector/vector.yml
        read_only: true
        content: |
          api:
            enabled: true
            address: 0.0.0.0:9001
          sources:
            docker_host:
              type: docker_logs
              exclude_containers:
                - supabase-vector
          transforms:
            only_this_project:
              type: filter
              inputs:
                - project_logs
              condition: |-
                uuid, err = get_env_var("COOLIFY_RESOURCE_UUID")
                err == null &&
                uuid != "" &&
                ends_with(string!(.appname), "-" + uuid)
            project_logs:
              type: remap
              inputs:
                - docker_host
              source: |-
                .project = "default"
                .event_message = del(.message)
                .appname = del(.container_name)
                del(.container_created_at)
                del(.container_id)
                del(.source_type)
                del(.stream)
                del(.label)
                del(.image)
                del(.host)
                del(.stream)
            router:
              type: route
              inputs:
                - only_this_project
              route:
                kong: 'starts_with(string!(.appname), "supabase-kong")'
                auth: 'starts_with(string!(.appname), "supabase-auth")'
                rest: 'starts_with(string!(.appname), "supabase-rest")'
                realtime: 'starts_with(string!(.appname), "realtime-dev")'
                storage: 'starts_with(string!(.appname), "supabase-storage")'
                functions: 'contains(string!(.appname), "supabase-edge-functions") || contains(string!(.appname), "supabase-functions")'
                db: 'starts_with(string!(.appname), "supabase-db")'
            # Ignores non nginx errors since they are related with kong booting up
            kong_logs:
              type: remap
              inputs:
                - router.kong
              source: |-
                req, err = parse_nginx_log(.event_message, "combined")
                if err == null {
                    .timestamp = req.timestamp
                    .metadata.request.headers.referer = req.referer
                    .metadata.request.headers.user_agent = req.agent
                    .metadata.request.headers.cf_connecting_ip = req.client
                    .metadata.response.status_code = req.status
                    url, split_err = split(req.request, " ")
                    if split_err == null {
                        .metadata.request.method = url[0]
                        .metadata.request.path = url[1]
                        .metadata.request.protocol = url[2]
                    }
                }
                if err != null {
                  abort
                }
            # Ignores non nginx errors since they are related with kong booting up
            kong_err:
              type: remap
              inputs:
                - router.kong
              source: |-
                .metadata.request.method = "GET"
                .metadata.response.status_code = 200
                parsed, err = parse_nginx_log(.event_message, "error")
                if err == null {
                    .timestamp = parsed.timestamp
                    .severity = parsed.severity
                    .metadata.request.host = parsed.host
                    .metadata.request.headers.cf_connecting_ip = parsed.client
                    url, err = split(parsed.request, " ")
                    if err == null {
                        .metadata.request.method = url[0]
                        .metadata.request.path = url[1]
                        .metadata.request.protocol = url[2]
                    }
                }
                if err != null {
                  abort
                }
            # Gotrue logs are structured json strings which frontend parses directly. But we keep metadata for consistency.
            auth_logs:
              type: remap
              inputs:
                - router.auth
              source: |-
                parsed, err = parse_json(.event_message)
                if err == null {
                    .metadata.timestamp = parsed.time
                    .metadata = merge!(.metadata, parsed)
                }
            # PostgREST logs are structured so we separate timestamp from message using regex
            rest_logs:
              type: remap
              inputs:
                - router.rest
              source: |-
                parsed, err = parse_regex(.event_message, r'^(?P<time>.*): (?P<msg>.*)$')
                if err == null {
                    .event_message = parsed.msg
                    .timestamp = parse_timestamp!(value: parsed.time,format: "%d/%b/%Y:%H:%M:%S %z")
                    .metadata.host = .project
                }
            # Filter out healthcheck logs from Realtime
            realtime_logs_filtered:
              type: filter
              inputs:
                - router.realtime
              condition: '!contains(string!(.event_message), "/health")'
            # Realtime logs are structured so we parse the severity level using regex (ignore time because it has no date)
            realtime_logs:
              type: remap
              inputs:
                - realtime_logs_filtered
              source: |-
                .metadata.project = del(.project)
                .metadata.external_id = .metadata.project
                parsed, err = parse_regex(.event_message, r'^(?P<time>\d+:\d+:\d+\.\d+) \[(?P<level>\w+)\] (?P<msg>.*)$')
                if err == null {
                    .event_message = parsed.msg
                    .metadata.level = parsed.level
                }
            # Supabase upstream fix: ensure local Edge Function logs carry metadata.project_ref
            functions_logs:
              type: remap
              inputs:
                - router.functions
              source: |-
                .metadata.project_ref = del(.project)
            # Storage logs may contain json objects so we parse them for completeness
            storage_logs:
              type: remap
              inputs:
                - router.storage
              source: |-
                .metadata.project = del(.project)
                .metadata.tenantId = .metadata.project
                parsed, err = parse_json(.event_message)
                if err == null {
                    .event_message = parsed.msg
                    .metadata.level = parsed.level
                    .metadata.timestamp = parsed.time
                    .metadata.context[0].host = parsed.hostname
                    .metadata.context[0].pid = parsed.pid
                }
            # Postgres logs some messages to stderr which we map to warning severity level
            db_logs:
              type: remap
              inputs:
                - router.db
              source: |-
                .metadata.host = "db-default"
                .metadata.parsed.timestamp = .timestamp

                parsed, err = parse_regex(.event_message, r'.*(?P<level>INFO|NOTICE|WARNING|ERROR|LOG|FATAL|PANIC?):.*', numeric_groups: true)

                if err != null || parsed == null {
                  .metadata.parsed.error_severity = "info"
                }
                if parsed.level != null {
                .metadata.parsed.error_severity = parsed.level
                }
                if .metadata.parsed.error_severity == "info" {
                    .metadata.parsed.error_severity = "log"
                }
                .metadata.parsed.error_severity = upcase!(.metadata.parsed.error_severity)
          sinks:
            logflare_auth:
              type: "http"
              inputs:
                - auth_logs
              encoding:
                codec: "json"
              method: "post"
              request:
                retry_max_duration_secs: 30
                retry_initial_backoff_secs: 1
                headers:
                  x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
              uri: "http://supabase-analytics:4000/api/logs?source_name=gotrue.logs.prod"
            logflare_realtime:
              type: "http"
              inputs:
                - realtime_logs
              encoding:
                codec: "json"
              method: "post"
              request:
                retry_max_duration_secs: 30
                retry_initial_backoff_secs: 1
                headers:
                  x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
              uri: "http://supabase-analytics:4000/api/logs?source_name=realtime.logs.prod"
            logflare_rest:
              type: "http"
              inputs:
                - rest_logs
              encoding:
                codec: "json"
              method: "post"
              request:
                retry_max_duration_secs: 30
                retry_initial_backoff_secs: 1
                headers:
                  x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
              uri: "http://supabase-analytics:4000/api/logs?source_name=postgREST.logs.prod"
            logflare_db:
              type: "http"
              inputs:
                - db_logs
              encoding:
                codec: "json"
              method: "post"
              request:
                retry_max_duration_secs: 30
                retry_initial_backoff_secs: 1
                headers:
                  x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
              # Route directly to analytics like other sinks. Retry handles the startup
              # race where analytics may not be ready yet when early DB logs arrive.
              uri: "http://supabase-analytics:4000/api/logs?source_name=postgres.logs"
            logflare_functions:
              type: "http"
              inputs:
                - router.functions
                - functions_logs
              encoding:
                codec: "json"
              method: "post"
              request:
                retry_max_duration_secs: 30
                retry_initial_backoff_secs: 1
                headers:
                  x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
              uri: "http://supabase-analytics:4000/api/logs?source_name=deno-relay-logs"
            logflare_storage:
              type: "http"
              inputs:
                - storage_logs
              encoding:
                codec: "json"
              method: "post"
              request:
                retry_max_duration_secs: 30
                retry_initial_backoff_secs: 1
                headers:
                  x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
              uri: "http://supabase-analytics:4000/api/logs?source_name=storage.logs.prod.2"
            logflare_kong:
              type: "http"
              inputs:
                - kong_logs
                - kong_err
              encoding:
                codec: "json"
              method: "post"
              request:
                retry_max_duration_secs: 10
                headers:
                  x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
              uri: "http://supabase-analytics:4000/api/logs?source_name=cloudflare.logs.prod"
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    environment:
      - 'LOGFLARE_API_KEY=${SERVICE_PASSWORD_LOGFLARE}'
      - 'LOGFLARE_PUBLIC_ACCESS_TOKEN=${SERVICE_PASSWORD_LOGFLARE}'
    command:
      - '--config'
      - etc/vector/vector.yml

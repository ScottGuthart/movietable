<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>Offline — MovieTable</title>
  <style>
    :root { color-scheme: light dark; --background: #ffffff; --foreground: #141414; --muted: #737373; --primary: #be185d; }
    @media (prefers-color-scheme: dark) { :root { --background: #141414; --foreground: #ffffff; --muted: #b4b4b4; --primary: #f472b6; } }
    * { box-sizing: border-box; }
    html { background: var(--background); color: var(--foreground); }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: calc(2rem + env(safe-area-inset-top, 0px)) calc(1.5rem + env(safe-area-inset-right, 0px)) calc(2rem + env(safe-area-inset-bottom, 0px)) calc(1.5rem + env(safe-area-inset-left, 0px)); font: 1rem/1.6 Georgia, serif; }
    main { width: 100%; max-width: 28rem; display: flex; flex-direction: column; gap: 1.5rem; }
    h1, p { margin: 0; }
    h1 { font-size: clamp(2rem, 8vw, 3rem); line-height: 1.2; text-wrap: balance; }
    .brand { font-weight: bold; font-size: 1.25rem; }
    .brand span { color: var(--primary); }
    .description { color: var(--muted); text-wrap: pretty; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 1.5rem; }
    button { border: 0; background: var(--primary); color: var(--background); font: inherit; font-weight: bold; padding: .75rem 1.25rem; min-height: 44px; cursor: pointer; }
    a { color: var(--foreground); text-underline-offset: .25rem; padding-block: .75rem; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">MovieTable<span>.</span></p>
    <h1>A short intermission.</h1>
    <p class="description">MovieTable can’t connect right now. Reconnect to browse films and access your ratings. Movies and account data aren’t stored for offline browsing.</p>
    <div class="actions">
      <button type="button" id="retry">Try again</button>
      <a href="/">Go to MovieTable</a>
    </div>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      if (window.location.pathname === '/offline.html') window.location.assign('/');
      else window.location.reload();
    });
  </script>
</body>
</html>
